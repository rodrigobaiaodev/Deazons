<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Deploy ID — updated on each build to bust CDN edge cache -->
    <meta name="deploy-id" content="1782943288565" />

    <!--
      NOTE: title, description, canonical, og:*, twitter:* are injected
      dynamically per-page by the <SeoHead> component (react-helmet-async).
      DO NOT add hardcoded canonical or duplicate meta tags here.
    -->

    <!-- Baseline title + canonical for SPA shell (react-helmet-async overrides per page in the browser) -->
    <title>Deazons | Filmes, Séries e Notícias de Entretenimento</title>
    <link rel="canonical" href="https://deazons.com/" />

    <!-- Permanent / non-dynamic meta -->
    <meta name="author" content="Deazons" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="keywords" content="filmes, séries, streaming, trailers, elenco, cinema, entretenimento, Netflix, Disney+, notícias" />
    <meta name="msvalidate.01" content="F16D5B4F632BF98B3BBB408FB7E6B6BB" />
    <meta property="og:site_name" content="Deazons" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:site" content="@deazons" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts – Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Preconnect to TMDB for faster image loading -->
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KSCKH5X0P6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KSCKH5X0P6');
    </script>

    <!-- Web Push Notifications -->
    <script charset="UTF-8" src="https://cdn.sendwebpush.com/sendwebpush/client_services/67ffc45ad8867.js" async></script>

    <!-- JoinAds Script -->
    <link rel="preload" href="https://script.joinads.me/myad27406.js" crossorigin="anonymous" as="script">
    <script type="module" src="https://script.joinads.me/myad27406.js" crossorigin="anonymous" async></script>

    <!-- Schema.org JSON-LD – Website (sitewide, not page-specific) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Deazons",
      "url": "https://deazons.com",
      "description": "Portal completo de entretenimento com informações sobre filmes, séries e notícias do mundo do cinema.",
      "inLanguage": "pt-BR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://deazons.com/pesquisa?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
