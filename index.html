<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Deploy ID — updated on each build to bust CDN edge cache -->
    <meta name="deploy-id" content="1786305000000" />

    <!--
      CRITICAL SEO: Do NOT put a homepage canonical here.
      A hardcoded canonical to / makes Google treat every SPA URL as the homepage
      when prerender is skipped. Per-page canonical/title/description come from:
      - /api/prerender for bots (vercel.json UA rewrite)
      - <SeoHead> (react-helmet-async) for browsers
    -->
    <title>Deazons | Filmes, Séries e Notícias de Entretenimento</title>

    <!-- Permanent / non-dynamic meta -->
    <meta name="author" content="Deazons" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="keywords" content="filmes, séries, streaming, trailers, elenco, cinema, entretenimento, Netflix, Disney+, notícias" />
    <meta name="msvalidate.01" content="F16D5B4F632BF98B3BBB408FB7E6B6BB" />
    <meta property="og:site_name" content="Deazons" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:site" content="@deazons" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts – Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Preconnect to TMDB for faster image loading -->
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KSCKH5X0P6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KSCKH5X0P6');
    </script>

    <!-- Web Push Notifications -->
    <script charset="UTF-8" src="https://cdn.sendwebpush.com/sendwebpush/client_services/67ffc45ad8867.js" async></script>

    <!-- JoinAds Script -->
    <link rel="preload" href="https://script.joinads.me/myad27406.js" crossorigin="anonymous" as="script">
    <script type="module" src="https://script.joinads.me/myad27406.js" crossorigin="anonymous" async></script>

    <!-- Google Publisher Tag (GPT) para Interstitial e Anchor -->
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
      window.googletag = window.googletag || {cmd: []};
      googletag.cmd.push(function() {
          var targeting = {
              'id_post_wp': [window.location.pathname.split('/').pop() || 'home']
          };

          if (window.location.search) {
              var urlParams = new URLSearchParams(window.location.search);
              ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'].forEach(function(k){
                  var v = urlParams.get(k);
                  if (v) targeting[k] = [v];
              });
          }

          googletag.setConfig({
              targeting: targeting,
              lazyLoad: { fetchMarginPercent: 20, renderMarginPercent: 10, mobileScaling: 2.0 },
              collapseDiv: 'ON_NO_FILL'
          });
      });

      googletag.cmd.push(function() {
          var slot = googletag.defineOutOfPageSlot('/23342075951/deazons.com/Deazons_WEB_Interstitial', googletag.enums.OutOfPageFormat.INTERSTITIAL);
          if (slot) {
              slot.setConfig({ targeting: { price: '5.00' } });
              slot.addService(googletag.pubads());
          }
          googletag.enableServices();
          googletag.display(slot);
      });

      googletag.cmd.push(function() {
          var anchorSlot = googletag.defineOutOfPageSlot('/23342075951/deazons.com/Deazons_WEB_Anchor', googletag.enums.OutOfPageFormat.TOP_ANCHOR);
          if (anchorSlot) {
              anchorSlot.setConfig({ targeting: { price: '3.00' } });
              anchorSlot.addService(googletag.pubads());
          }
          googletag.enableServices();
          googletag.display(anchorSlot);
      });
    </script>

    <!-- Schema.org JSON-LD – Website (sitewide; page-specific schemas come from SeoHead/prerender) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Deazons",
      "url": "https://deazons.com",
      "description": "Portal completo de entretenimento com informações sobre filmes, séries e notícias do mundo do cinema.",
      "inLanguage": "pt-BR"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
